name: Build Android remote app (APK)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Work out the versions
        id: v
        run: |
          cd p1-app-pc/mobile
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(node -p "require('./package.json').version"); fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "minnative=$(tr -d '[:space:]' < min-native-version-code.txt)" >> "$GITHUB_OUTPUT"
          
      - name: Stamp the web version
        run: |
          cd p1-app-pc/mobile
          echo '{"version":"${{ steps.v.outputs.name }}"}' > www/bundle-version.json
          
      - name: Install web dependencies
        run: |
          cd p1-app-pc/mobile
          npm install

      - name: Build APK with Gradle
        run: |
          cd p1-app-pc/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: p1-app-pc/mobile/android/app/build/outputs/apk/debug/app-debug.apk
